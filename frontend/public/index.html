<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="connection-indicator" id="connectionIndicator"></div>
    <h1>Canvas</h1>
    <div class="app-layout">
        <div class="canvas-container">
            <canvas id="canvas" class="canvas"></canvas>
            <div class="canvas-text">press on me</div>
        </div>
        <div class="chat-panel">
            <div class="chat-output" id="chatOutput"></div>
            <div class="chat-input-row">
                <input
                    id="chatInput"
                    class="chat-input"
                    type="text"
                    placeholder="Ask the AI…"
                    autocomplete="off"
                />
                <button id="chatSend" class="chat-send">Send</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
    <script src="https://cdn.ably.com/spaces/0.5.2/iife/index.bundle.js"></script>
    <script src="script.js"></script>
</body>
</html>
